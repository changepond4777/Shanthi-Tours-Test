<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shanthi Tours — Tour Operations Management</title>

  <!-- Google Material Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Material UI (MUI v5 Core) -->
  <script src="https://unpkg.com/@mui/material@5.15.14/umd/material-ui.production.min.js" crossorigin></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    /* Fix Issue #1: Dropdown arrow spacing away from the border */
    .MuiSelect-icon {
      right: 12px !important;
    }
    .MuiOutlinedInput-root .MuiSelect-select {
      padding-right: 36px !important;
    }

    /* Fix Issue #3: Red asterisk styling */
    .required-star {
      color: #d32f2f;
      font-weight: 700;
      margin-left: 2px;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider, createTheme, CssBaseline, Box, Container, Typography,
      AppBar, Toolbar, Button, IconButton, TextField, InputAdornment, Select,
      MenuItem, FormControl, InputLabel, Card, CardContent, CardActions,
      Chip, Grid, LinearProgress, Table, TableHead, TableRow, TableCell,
      TableBody, TableContainer, Paper, Dialog, DialogTitle, DialogContent,
      DialogActions, Snackbar, Alert, BottomNavigation, BottomNavigationAction,
      Drawer, List, ListItem, ListItemButton, ListItemIcon, ListItemText, Divider,
      useMediaQuery
    } = MaterialUI;

    // Helper component for red mandatory asterisks
    const Req = () => <span className="required-star">*</span>;

    const theme = createTheme({
      palette: {
        primary: { main: '#1976d2', dark: '#115293', light: '#e3f2fd' },
        secondary: { main: '#7c3aed', light: '#f3e8ff' },
        success: { main: '#2e7d32', light: '#edf7ed' },
        warning: { main: '#ed6c02', light: '#fff4e5' },
        error: { main: '#d32f2f', light: '#fdeded' },
        background: { default: '#f8fafc', paper: '#ffffff' }
      },
      typography: {
        fontFamily: "'Roboto', sans-serif",
        h6: { fontWeight: 700 },
        subtitle1: { fontWeight: 600 }
      },
      shape: { borderRadius: 8 },
      components: {
        MuiSelect: {
          styleOverrides: {
            icon: {
              right: 12
            }
          }
        }
      }
    });

    const firebaseConfig = {
      apiKey: "AIzaSyCsbSo8KC_Gqwoyy236Hjq266idEOeUOfs",
      authDomain: "shanthi-tours.firebaseapp.com",
      projectId: "shanthi-tours",
      storageBucket: "shanthi-tours.firebasestorage.app",
      messagingSenderId: "629519666023",
      appId: "1:629519666023:web:f9db1b5d80d413e755fdc2",
      measurementId: "G-63NBK0K5S9"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const computeAge = (dobStr) => {
      if (!dobStr) return '-';
      const bDate = new Date(dobStr);
      if (isNaN(bDate.getTime())) return '-';
      const today = new Date();
      let age = today.getFullYear() - bDate.getFullYear();
      const m = today.getMonth() - bDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < bDate.getDate())) age--;
      return age >= 0 ? age : '-';
    };

    function App() {
      const isMobile = useMediaQuery(theme.breakpoints.down('sm'));
      const [view, setView] = React.useState('trips');
      const [trips, setTrips] = React.useState([]);
      const [activeTripId, setActiveTripId] = React.useState(null);

      // Filters
      const [searchQuery, setSearchQuery] = React.useState('');
      const [categoryFilter, setCategoryFilter] = React.useState('ALL');
      const [capacityFilter, setCapacityFilter] = React.useState('ALL');
      const [sortFilter, setSortFilter] = React.useState('DEPARTURE_NEAR');

      // Modals
      const [tripDialogOpen, setTripDialogOpen] = React.useState(false);
      const [editTripId, setEditTripId] = React.useState(null);
      const [tripForm, setTripForm] = React.useState({ name: '', type: 'Local', date: '', amount: '', totalSeats: '20', notes: '' });

      const [paxDialogOpen, setPaxDialogOpen] = React.useState(false);
      const [editPaxIndex, setEditPaxIndex] = React.useState(-1);
      const [paxForm, setPaxForm] = React.useState({ seat: '', name: '', phone: '', gender: 'Male', dob: '', aadhaar: '', passport: '', payment: '' });

      const [snackbar, setSnackbar] = React.useState({ open: false, message: '', severity: 'info' });

      React.useEffect(() => {
        const unsubscribe = db.collection('trips').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setTrips(list);
        });
        return () => unsubscribe();
      }, []);

      const showToast = (message, severity = 'info') => {
        setSnackbar({ open: true, message, severity });
      };

      const activeTrip = trips.find(t => t.id === activeTripId);

      const filteredTrips = trips.filter(t => {
        const nameMatch = !searchQuery || (t.name || '').toLowerCase().includes(searchQuery.toLowerCase());
        const typeMatch = categoryFilter === 'ALL' || (t.type || 'Local') === categoryFilter;
        const totalSeats = parseInt(t.totalSeats, 10) || 0;
        const filled = (t.members || []).length;
        const ratio = totalSeats > 0 ? filled / totalSeats : 0;

        let capMatch = true;
        if (capacityFilter === 'AVAILABLE') capMatch = ratio < 0.8;
        else if (capacityFilter === 'NEARLY_FULL') capMatch = ratio >= 0.8 && ratio < 1;
        else if (capacityFilter === 'FULL') capMatch = ratio >= 1;

        return nameMatch && typeMatch && capMatch;
      }).sort((a, b) => {
        if (sortFilter === 'DEPARTURE_NEAR') return (a.date || '9999').localeCompare(b.date || '9999');
        if (sortFilter === 'PRICE_DESC') return (b.amount || 0) - (a.amount || 0);
        return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
      });

      const handleOpenCreateTrip = () => {
        setEditTripId(null);
        setTripForm({ name: '', type: 'Local', date: '', amount: '', totalSeats: '20', notes: '' });
        setTripDialogOpen(true);
      };

      const handleOpenEditTrip = (t) => {
        setEditTripId(t.id);
        setTripForm({
          name: t.name || '',
          type: t.type || 'Local',
          date: t.date || '',
          amount: t.amount || '',
          totalSeats: t.totalSeats || '',
          notes: t.notes || ''
        });
        setTripDialogOpen(true);
      };

      const handleSaveTrip = () => {
        if (!tripForm.name.trim() || !tripForm.date) {
          return showToast('Trip name and departure date are required.', 'error');
        }

        const payload = {
          name: tripForm.name.trim(),
          type: tripForm.type,
          date: tripForm.date,
          amount: parseFloat(tripForm.amount) || 0,
          totalSeats: parseInt(tripForm.totalSeats, 10) || 0,
          notes: tripForm.notes.trim(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editTripId) {
          db.collection('trips').doc(editTripId).update(payload).then(() => {
            setTripDialogOpen(false);
            showToast('Trip updated successfully', 'success');
          });
        } else {
          payload.status = 'Ongoing';
          payload.members = [];
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          db.collection('trips').add(payload).then(() => {
            setTripDialogOpen(false);
            showToast('New trip created', 'success');
          });
        }
      };

      const handleDeleteTrip = (tripId, tripName) => {
        if (!window.confirm(`Are you sure you want to delete "${tripName}"? This cannot be undone.`)) return;
        db.collection('trips').doc(tripId).delete().then(() => {
          showToast('Trip removed', 'info');
          if (activeTripId === tripId) setView('trips');
        });
      };

      const handleDuplicateTrip = (t) => {
        const newTitle = window.prompt('Title for duplicated trip:', `${t.name} (Copy)`);
        if (!newTitle) return;

        db.collection('trips').add({
          name: newTitle.trim(),
          type: t.type || 'Local',
          date: t.date || '',
          amount: t.amount || 0,
          totalSeats: t.totalSeats || 0,
          notes: t.notes || '',
          status: 'Ongoing',
          members: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => showToast('Duplicate trip created', 'success'));
      };

      const handleOpenAddPax = () => {
        setEditPaxIndex(-1);
        setPaxForm({ seat: '', name: '', phone: '', gender: 'Male', dob: '', aadhaar: '', passport: '', payment: '' });
        setPaxDialogOpen(true);
      };

      const handleOpenEditPax = (m, index) => {
        setEditPaxIndex(index);
        setPaxForm({
          seat: m.seat || '',
          name: m.name || '',
          phone: m.phone || '',
          gender: m.gender || 'Male',
          dob: m.dob || '',
          aadhaar: m.aadhaar || '',
          passport: m.passport || '',
          payment: activeTrip.type === 'Local' ? (m.amountPaid || '') : (m.advance || '')
        });
        setPaxDialogOpen(true);
      };

      const handleSavePassenger = () => {
        if (!paxForm.name.trim() || !paxForm.seat.trim()) {
          return showToast('Passenger name and seat number are required.', 'error');
        }

        const tripRef = db.collection('trips').doc(activeTripId);

        db.runTransaction((transaction) => {
          return transaction.get(tripRef).then((doc) => {
            if (!doc.exists) return;
            const data = doc.data();
            const members = data.members || [];
            const seatKey = paxForm.seat.trim().toUpperCase();

            const seatConflict = members.find((m, i) => i !== editPaxIndex && m.seat && m.seat.trim().toUpperCase() === seatKey);
            if (seatConflict) {
              throw new Error(`Seat ${seatKey} is already booked by ${seatConflict.name}`);
            }

            const paxObj = {
              seat: seatKey,
              name: paxForm.name.trim(),
              phone: paxForm.phone.trim(),
              gender: paxForm.gender
            };

            if (data.type === 'Local') {
              paxObj.amountPaid = parseFloat(paxForm.payment) || 0;
            } else {
              paxObj.dob = paxForm.dob;
              paxObj.advance = parseFloat(paxForm.payment) || 0;
              if (data.type === 'Train/Flight') paxObj.aadhaar = paxForm.aadhaar.trim();
              if (data.type === 'International') paxObj.passport = paxForm.passport.trim();
            }

            if (editPaxIndex >= 0) members[editPaxIndex] = { ...members[editPaxIndex], ...paxObj };
            else members.push(paxObj);

            transaction.update(tripRef, { members });
          });
        }).then(() => {
          setPaxDialogOpen(false);
          showToast('Passenger saved', 'success');
        }).catch(err => showToast(err.message, 'error'));
      };

      const handleDeletePassenger = (index) => {
        if (!window.confirm('Remove this passenger from the trip?')) return;
        const tripRef = db.collection('trips').doc(activeTripId);
        db.runTransaction((transaction) => {
          return transaction.get(tripRef).then((doc) => {
            const members = doc.data().members || [];
            members.splice(index, 1);
            transaction.update(tripRef, { members });
          });
        }).then(() => showToast('Passenger removed', 'info'));
      };

      const handleExportCSV = () => {
        if (!activeTrip) return;
        let csv = "Seat,Name,Phone,Gender,Paid,Due Balance\n";
        const price = parseFloat(activeTrip.amount) || 0;
        (activeTrip.members || []).forEach(m => {
          const paid = activeTrip.type === 'Local' ? (parseFloat(m.amountPaid) || 0) : (parseFloat(m.advance) || 0);
          const due = Math.max(0, price - paid);
          csv += `"${m.seat || ''}","${m.name || ''}","${m.phone || ''}","${m.gender || ''}",${paid},${due}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${activeTrip.name}_Manifest.csv`;
        a.click();
      };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Box sx={{ display: 'flex', minHeight: '100vh', pb: isMobile ? 8 : 0 }}>
            {/* Desktop Left Drawer Navigation */}
            {!isMobile && (
              <Drawer
                variant="permanent"
                className="no-print"
                sx={{
                  width: 240,
                  flexShrink: 0,
                  [`& .MuiDrawer-paper`]: { width: 240, boxSizing: 'border-box', borderRight: '1px solid #e2e8f0' },
                }}
              >
                <Toolbar>
                  <Typography variant="h6" color="primary" sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                    <span className="material-icons">explore</span> Shanthi Tours
                  </Typography>
                </Toolbar>
                <Divider />
                <List sx={{ px: 1, pt: 1 }}>
                  <ListItem disablePadding>
                    <ListItemButton selected={view === 'trips' || view === 'tripDetail'} onClick={() => setView('trips')} sx={{ borderRadius: 1 }}>
                      <ListItemIcon><span className="material-icons" style={{ color: view === 'trips' ? '#1976d2' : '#64748b' }}>map</span></ListItemIcon>
                      <ListItemText primary="Trips" primaryTypographyProps={{ fontWeight: 600, fontSize: 14 }} />
                    </ListItemButton>
                  </ListItem>
                  <ListItem disablePadding>
                    <ListItemButton selected={view === 'passengers'} onClick={() => setView('passengers')} sx={{ borderRadius: 1 }}>
                      <ListItemIcon><span className="material-icons" style={{ color: view === 'passengers' ? '#1976d2' : '#64748b' }}>group</span></ListItemIcon>
                      <ListItemText primary="Passengers" primaryTypographyProps={{ fontWeight: 600, fontSize: 14 }} />
                    </ListItemButton>
                  </ListItem>
                  <ListItem disablePadding>
                    <ListItemButton selected={view === 'reports'} onClick={() => setView('reports')} sx={{ borderRadius: 1 }}>
                      <ListItemIcon><span className="material-icons" style={{ color: view === 'reports' ? '#1976d2' : '#64748b' }}>bar_chart</span></ListItemIcon>
                      <ListItemText primary="Reports & Dues" primaryTypographyProps={{ fontWeight: 600, fontSize: 14 }} />
                    </ListItemButton>
                  </ListItem>
                </List>
              </Drawer>
            )}

            {/* Main Application Area */}
            <Box component="main" sx={{ flexGrow: 1, minWidth: 0 }}>
              <AppBar position="sticky" color="inherit" elevation={1} className="no-print" sx={{ bgcolor: '#fff', borderBottom: '1px solid #e2e8f0' }}>
                <Toolbar sx={{ justifyContent: 'space-between' }}>
                  <Typography variant="h6" sx={{ fontSize: 18, color: '#0f172a' }}>
                    {view === 'trips' && 'Tour Operations'}
                    {view === 'tripDetail' && 'Tour Workspace'}
                    {view === 'passengers' && 'Passenger Directory'}
                    {view === 'reports' && 'Financial Reports & Dues'}
                  </Typography>
                  <Chip
                    icon={<span className="material-icons" style={{ fontSize: 14, color: '#2e7d32' }}>wifi</span>}
                    label="Cloud Live"
                    size="small"
                    color="success"
                    variant="outlined"
                  />
                </Toolbar>
              </AppBar>

              <Container maxWidth="lg" sx={{ py: 3 }}>
                {/* ===================== VIEW 1: TRIPS (2-CARD GRID) ===================== */}
                {view === 'trips' && (
                  <Box>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 2.5, flexWrap: 'wrap', gap: 1 }}>
                      <Typography variant="body2" color="text.secondary">
                        Manage bookings, seat allocations, and payment statuses
                      </Typography>
                      <Button
                        variant="contained"
                        color="primary"
                        startIcon={<span className="material-icons">add</span>}
                        onClick={handleOpenCreateTrip}
                      >
                        Create New Trip
                      </Button>
                    </Box>

                    {/* Filter & Search Bar */}
                    <Paper elevation={0} sx={{ p: 2, mb: 3, border: '1px solid #e2e8f0', borderRadius: 2 }}>
                      <Grid container spacing={1.5} alignItems="center">
                        <Grid item xs={12} sm={4}>
                          <TextField
                            fullWidth
                            size="small"
                            placeholder="Search by trip name..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            InputProps={{
                              startAdornment: (
                                <InputAdornment position="start">
                                  <span className="material-icons" style={{ color: '#94a3b8', fontSize: 20 }}>search</span>
                                </InputAdornment>
                              )
                            }}
                          />
                        </Grid>
                        <Grid item xs={6} sm={2.5}>
                          <FormControl fullWidth size="small">
                            <InputLabel id="cat-label">Category</InputLabel>
                            <Select labelId="cat-label" value={categoryFilter} label="Category" onChange={(e) => setCategoryFilter(e.target.value)}>
                              <MenuItem value="ALL">All Categories</MenuItem>
                              <MenuItem value="Local">Local</MenuItem>
                              <MenuItem value="Train/Flight">Train/Flight</MenuItem>
                              <MenuItem value="International">International</MenuItem>
                            </Select>
                          </FormControl>
                        </Grid>
                        <Grid item xs={6} sm={2.5}>
                          <FormControl fullWidth size="small">
                            <InputLabel id="cap-label">Capacity</InputLabel>
                            <Select labelId="cap-label" value={capacityFilter} label="Capacity" onChange={(e) => setCapacityFilter(e.target.value)}>
                              <MenuItem value="ALL">All Capacities</MenuItem>
                              <MenuItem value="AVAILABLE">Available</MenuItem>
                              <MenuItem value="NEARLY_FULL">Nearly Full (≥80%)</MenuItem>
                              <MenuItem value="FULL">Full (100%)</MenuItem>
                            </Select>
                          </FormControl>
                        </Grid>
                        <Grid item xs={12} sm={3}>
                          <FormControl fullWidth size="small">
                            <InputLabel id="sort-label">Sort By</InputLabel>
                            <Select labelId="sort-label" value={sortFilter} label="Sort By" onChange={(e) => setSortFilter(e.target.value)}>
                              <MenuItem value="DEPARTURE_NEAR">Nearest Departure</MenuItem>
                              <MenuItem value="PRICE_DESC">Price (High to Low)</MenuItem>
                            </Select>
                          </FormControl>
                        </Grid>
                      </Grid>
                    </Paper>

                    {/* 2-Card Per Row Grid */}
                    <Grid container spacing={2}>
                      {filteredTrips.map((t) => {
                        const totalSeats = parseInt(t.totalSeats, 10) || 0;
                        const filled = (t.members || []).length;
                        const capPct = totalSeats > 0 ? Math.min(100, Math.round((filled / totalSeats) * 100)) : 0;
                        const price = parseFloat(t.amount) || 0;

                        return (
                          <Grid item xs={12} sm={6} key={t.id}>
                            <Card
                              elevation={0}
                              sx={{
                                border: '1px solid #e2e8f0',
                                borderRadius: 2,
                                transition: 'all 0.15s ease',
                                cursor: 'pointer',
                                '&:hover': { borderColor: 'primary.main', boxShadow: '0 4px 12px rgba(0,0,0,0.06)' }
                              }}
                              onClick={() => { setActiveTripId(t.id); setView('tripDetail'); }}
                            >
                              <CardContent sx={{ pb: 1 }}>
                                <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', mb: 1 }}>
                                  <Typography variant="subtitle1" sx={{ fontWeight: 700, fontSize: 17 }}>
                                    {t.name}
                                  </Typography>
                                  <Chip label={t.status || 'Ongoing'} size="small" color={t.status === 'Full' ? 'error' : 'primary'} variant="outlined" />
                                </Box>

                                <Box sx={{ display: 'flex', gap: 0.8, flexWrap: 'wrap', mb: 1.5 }}>
                                  <Chip label={t.type || 'Local'} size="small" color="secondary" />
                                  <Chip label={totalSeats > 0 ? `${filled}/${totalSeats} Seats` : `${filled} Booked`} size="small" variant="outlined" />
                                </Box>

                                <Typography variant="body2" color="text.secondary">
                                  🗓 Departure: <strong>{t.date || 'TBD'}</strong>
                                </Typography>
                                <Typography variant="body2" color="text.secondary">
                                  💰 Price: <strong>₹{price.toLocaleString('en-IN')}</strong> / person
                                </Typography>

                                {totalSeats > 0 && (
                                  <Box sx={{ mt: 1.5 }}>
                                    <Box sx={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, fontWeight: 600, mb: 0.5, color: '#64748b' }}>
                                      <span>Occupancy</span>
                                      <span>{capPct}%</span>
                                    </Box>
                                    <LinearProgress variant="determinate" value={capPct} color={capPct >= 100 ? 'error' : (capPct >= 80 ? 'warning' : 'primary')} sx={{ height: 6, borderRadius: 3 }} />
                                  </Box>
                                )}
                              </CardContent>
                              <CardActions sx={{ justifyContent: 'space-between', px: 2, pt: 0, pb: 1.5 }}>
                                <Button size="small" color="primary">Manage Roster →</Button>
                                <Typography variant="caption" color="text.secondary">Click to open</Typography>
                              </CardActions>
                            </Card>
                          </Grid>
                        );
                      })}
                      {filteredTrips.length === 0 && (
                        <Grid item xs={12}>
                          <Paper sx={{ p: 4, textAlign: 'center', color: 'text.secondary' }}>No trips found matching criteria.</Paper>
                        </Grid>
                      )}
                    </Grid>
                  </Box>
                )}

                {/* ===================== VIEW 2: TRIP DETAIL ===================== */}
                {view === 'tripDetail' && activeTrip && (
                  <Box>
                    {/* Fix Issue #2: Properly vertically centered "Back to Trips" Button and icon */}
                    <Box sx={{ mb: 2, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }} className="no-print">
                      <Button
                        variant="outlined"
                        onClick={() => setView('trips')}
                        sx={{
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '6px',
                          textTransform: 'none',
                          fontWeight: 600
                        }}
                      >
                        <span className="material-icons" style={{ fontSize: 18, lineHeight: 1, display: 'flex', alignItems: 'center' }}>arrow_back</span>
                        <span>Back to Trips</span>
                      </Button>
                      <Box sx={{ display: 'flex', gap: 1 }}>
                        <Button variant="outlined" color="primary" onClick={() => handleOpenEditTrip(activeTrip)}>Edit Tour</Button>
                        <Button variant="outlined" color="secondary" onClick={() => handleDuplicateTrip(activeTrip)}>Duplicate</Button>
                        <Button variant="outlined" color="error" onClick={() => handleDeleteTrip(activeTrip.id, activeTrip.name)}>Delete</Button>
                      </Box>
                    </Box>

                    {/* Header Summary Card */}
                    <Card elevation={0} sx={{ p: 2.5, mb: 3, border: '1px solid #e2e8f0', borderRadius: 2 }}>
                      <Typography variant="h5" sx={{ fontWeight: 800 }}>{activeTrip.name}</Typography>
                      <Typography variant="body2" color="text.secondary" sx={{ mb: 2 }}>
                        Category: <strong>{activeTrip.type}</strong> | Departure: <strong>{activeTrip.date || 'TBD'}</strong> | Price: <strong>₹{parseFloat(activeTrip.amount || 0).toLocaleString('en-IN')}</strong>
                      </Typography>
                      <Grid container spacing={2}>
                        <Grid item xs={6} sm={3}>
                          <Typography variant="caption" color="text.secondary">BOOKINGS</Typography>
                          <Typography variant="h6">{(activeTrip.members || []).length} / {activeTrip.totalSeats || '∞'}</Typography>
                        </Grid>
                        <Grid item xs={6} sm={3}>
                          <Typography variant="caption" color="text.secondary">TOTAL COLLECTED</Typography>
                          <Typography variant="h6" color="success.main">
                            ₹{(activeTrip.members || []).reduce((acc, m) => acc + (activeTrip.type === 'Local' ? (parseFloat(m.amountPaid) || 0) : (parseFloat(m.advance) || 0)), 0).toLocaleString('en-IN')}
                          </Typography>
                        </Grid>
                      </Grid>
                    </Card>

                    {/* Passenger Manifest Roster */}
                    <Paper elevation={0} sx={{ border: '1px solid #e2e8f0', borderRadius: 2, overflow: 'hidden' }}>
                      <Box sx={{ p: 2, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 1 }}>
                        <Typography variant="subtitle1">Passenger Manifest ({(activeTrip.members || []).length})</Typography>
                        <Box sx={{ display: 'flex', gap: 1 }} className="no-print">
                          <Button size="small" variant="outlined" startIcon={<span className="material-icons">download</span>} onClick={handleExportCSV}>Export CSV</Button>
                          <Button size="small" variant="outlined" startIcon={<span className="material-icons">print</span>} onClick={() => window.print()}>Print</Button>
                          <Button size="small" variant="contained" color="primary" startIcon={<span className="material-icons">add</span>} onClick={handleOpenAddPax}>Add Passenger</Button>
                        </Box>
                      </Box>

                      <TableContainer>
                        <Table size="small">
                          <TableHead sx={{ bgcolor: '#f8fafc' }}>
                            <TableRow>
                              <TableCell><strong>Seat</strong></TableCell>
                              <TableCell><strong>Passenger Name</strong></TableCell>
                              <TableCell><strong>Phone</strong></TableCell>
                              <TableCell><strong>Gender / Age</strong></TableCell>
                              <TableCell><strong>ID Verification</strong></TableCell>
                              <TableCell><strong>Payment</strong></TableCell>
                              <TableCell align="right" className="no-print"><strong>Actions</strong></TableCell>
                            </TableRow>
                          </TableHead>
                          <TableBody>
                            {(activeTrip.members || []).map((m, idx) => {
                              const tripPrice = parseFloat(activeTrip.amount) || 0;
                              const paid = activeTrip.type === 'Local' ? (parseFloat(m.amountPaid) || 0) : (parseFloat(m.advance) || 0);
                              const due = Math.max(0, tripPrice - paid);
                              const cleanPhone = (m.phone || '').replace(/[^0-9]/g, '');
                              const waPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
                              const waMsg = encodeURIComponent(`Hi ${m.name}, friendly reminder from Shanthi Tours for "${activeTrip.name}". Outstanding balance: ₹${due}. Thank you!`);

                              return (
                                <TableRow key={idx} hover>
                                  <TableCell><Chip label={m.seat || '-'} size="small" sx={{ fontWeight: 700 }} /></TableCell>
                                  <TableCell><strong>{m.name}</strong></TableCell>
                                  <TableCell>{m.phone || '-'}</TableCell>
                                  <TableCell>{m.gender} / {computeAge(m.dob)}</TableCell>
                                  <TableCell>
                                    <Chip
                                      size="small"
                                      variant="outlined"
                                      label={
                                        activeTrip.type === 'Train/Flight'
                                          ? (m.aadhaar ? '[Aadhaar Redacted]' : 'No ID')
                                          : (activeTrip.type === 'International' ? (m.passport || 'No Passport') : 'Verified')
                                      }
                                    />
                                  </TableCell>
                                  <TableCell>
                                    <Chip label={due === 0 ? 'Paid' : `Due ₹${due.toLocaleString('en-IN')}`} size="small" color={due === 0 ? 'success' : 'error'} />
                                  </TableCell>
                                  <TableCell align="right" className="no-print">
                                    {cleanPhone && (
                                      <IconButton size="small" color="success" href={`https://wa.me/${waPhone}?text=${waMsg}`} target="_blank">
                                        <span className="material-icons" style={{ fontSize: 18 }}>chat</span>
                                      </IconButton>
                                    )}
                                    <IconButton size="small" color="primary" onClick={() => handleOpenEditPax(m, idx)}>
                                      <span className="material-icons" style={{ fontSize: 18 }}>edit</span>
                                    </IconButton>
                                    <IconButton size="small" color="error" onClick={() => handleDeletePassenger(idx)}>
                                      <span className="material-icons" style={{ fontSize: 18 }}>delete</span>
                                    </IconButton>
                                  </TableCell>
                                </TableRow>
                              );
                            })}
                            {(activeTrip.members || []).length === 0 && (
                              <TableRow>
                                <TableCell colSpan={7} align="center" sx={{ py: 3, color: 'text.secondary' }}>
                                  No passengers added to this trip yet.
                                </TableCell>
                              </TableRow>
                            )}
                          </TableBody>
                        </Table>
                      </TableContainer>
                    </Paper>
                  </Box>
                )}

                {/* ===================== VIEW 3: PASSENGERS DIRECTORY ===================== */}
                {view === 'passengers' && (
                  <Paper elevation={0} sx={{ border: '1px solid #e2e8f0', borderRadius: 2 }}>
                    <Box sx={{ p: 2 }}>
                      <Typography variant="subtitle1">Consolidated Customer Directory</Typography>
                      <Typography variant="caption" color="text.secondary">Lifetime bookings across all historical trips</Typography>
                    </Box>
                    <TableContainer>
                      <Table size="small">
                        <TableHead sx={{ bgcolor: '#f8fafc' }}>
                          <TableRow>
                            <TableCell><strong>Customer</strong></TableCell>
                            <TableCell><strong>Phone</strong></TableCell>
                            <TableCell align="center"><strong>Tours Count</strong></TableCell>
                            <TableCell><strong>Tour History</strong></TableCell>
                          </TableRow>
                        </TableHead>
                        <TableBody>
                          {(() => {
                            const directory = {};
                            trips.forEach(t => {
                              (t.members || []).forEach(m => {
                                const key = (m.phone && m.phone.trim()) ? m.phone.replace(/[^0-9]/g, '') : (m.name || 'Unnamed').toLowerCase().trim();
                                if (!directory[key]) directory[key] = { name: m.name, phone: m.phone || '-', tours: [] };
                                if (!directory[key].tours.includes(t.name)) directory[key].tours.push(t.name);
                              });
                            });
                            return Object.values(directory).map((c, i) => (
                              <TableRow key={i} hover>
                                <TableCell><strong>{c.name}</strong></TableCell>
                                <TableCell>{c.phone}</TableCell>
                                <TableCell align="center"><Chip label={`${c.tours.length} Tours`} size="small" color="primary" /></TableCell>
                                <TableCell sx={{ color: 'text.secondary', fontSize: 12 }}>{c.tours.join(', ')}</TableCell>
                              </TableRow>
                            ));
                          })()}
                        </TableBody>
                      </Table>
                    </TableContainer>
                  </Paper>
                )}

                {/* ===================== VIEW 4: REPORTS & DUES ===================== */}
                {view === 'reports' && (
                  <Box>
                    <Paper elevation={0} sx={{ border: '1px solid #e2e8f0', borderRadius: 2 }}>
                      <Box sx={{ p: 2 }}>
                        <Typography variant="subtitle1" color="error">Outstanding Passenger Balances</Typography>
                        <Typography variant="caption" color="text.secondary">Sorted by highest outstanding dues first</Typography>
                      </Box>
                      <TableContainer>
                        <Table size="small">
                          <TableHead sx={{ bgcolor: '#f8fafc' }}>
                            <TableRow>
                              <TableCell><strong>Passenger</strong></TableCell>
                              <TableCell><strong>Phone</strong></TableCell>
                              <TableCell><strong>Tour</strong></TableCell>
                              <TableCell><strong>Departure</strong></TableCell>
                              <TableCell><strong>Due (₹)</strong></TableCell>
                              <TableCell align="right"><strong>Action</strong></TableCell>
                            </TableRow>
                          </TableHead>
                          <TableBody>
                            {(() => {
                              const dues = [];
                              trips.forEach(t => {
                                const price = parseFloat(t.amount) || 0;
                                (t.members || []).forEach(m => {
                                  const paid = t.type === 'Local' ? (parseFloat(m.amountPaid) || 0) : (parseFloat(m.advance) || 0);
                                  const due = Math.max(0, price - paid);
                                  if (due > 0) dues.push({ name: m.name, phone: m.phone, trip: t.name, date: t.date, due });
                                });
                              });
                              dues.sort((a, b) => b.due - a.due);

                              return dues.map((d, i) => {
                                const clean = (d.phone || '').replace(/[^0-9]/g, '');
                                const wa = clean.length === 10 ? '91' + clean : clean;
                                const msg = encodeURIComponent(`Hello ${d.name}, reminder from Shanthi Tours regarding "${d.trip}". Balance due: ₹${d.due}.`);

                                return (
                                  <TableRow key={i} hover>
                                    <TableCell><strong>{d.name}</strong></TableCell>
                                    <TableCell>{d.phone || '-'}</TableCell>
                                    <TableCell>{d.trip}</TableCell>
                                    <TableCell>{d.date || 'TBD'}</TableCell>
                                    <TableCell sx={{ color: 'error.main', fontWeight: 700 }}>₹{d.due.toLocaleString('en-IN')}</TableCell>
                                    <TableCell align="right">
                                      {clean ? (
                                        <Button size="small" variant="contained" color="success" href={`https://wa.me/${wa}?text=${msg}`} target="_blank">
                                          Remind
                                        </Button>
                                      ) : '-'}
                                    </TableCell>
                                  </TableRow>
                                );
                              });
                            })()}
                          </TableBody>
                        </Table>
                      </TableContainer>
                    </Paper>
                  </Box>
                )}
              </Container>
            </Box>
          </Box>

          {/* Mobile Bottom Navigation */}
          {isMobile && (
            <Paper sx={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 100 }} elevation={3} className="no-print">
              <BottomNavigation
                showLabels
                value={view === 'tripDetail' ? 'trips' : view}
                onChange={(e, val) => setView(val)}
              >
                <BottomNavigationAction label="Trips" value="trips" icon={<span className="material-icons">map</span>} />
                <BottomNavigationAction label="Passengers" value="passengers" icon={<span className="material-icons">group</span>} />
                <BottomNavigationAction label="Reports" value="reports" icon={<span className="material-icons">bar_chart</span>} />
              </BottomNavigation>
            </Paper>
          )}

          {/* ===================== MATERIAL DIALOG: CREATE / EDIT TRIP (Fix Issue #3: Red Asterisks) ===================== */}
          <Dialog open={tripDialogOpen} onClose={() => setTripDialogOpen(false)} fullWidth maxWidth="sm">
            <DialogTitle>{editTripId ? 'Edit Tour' : 'Create New Tour'}</DialogTitle>
            <DialogContent dividers>
              <TextField
                fullWidth
                label={<>Tour Title <Req /></>}
                value={tripForm.name}
                onChange={(e) => setTripForm({ ...tripForm, name: e.target.value })}
                margin="normal"
                size="small"
              />
              <Grid container spacing={2} sx={{ mt: 0.5 }}>
                <Grid item xs={6}>
                  <FormControl fullWidth size="small">
                    <InputLabel id="trip-cat-label">Category <Req /></InputLabel>
                    <Select labelId="trip-cat-label" value={tripForm.type} label={<>Category <Req /></>} onChange={(e) => setTripForm({ ...tripForm, type: e.target.value })}>
                      <MenuItem value="Local">Local</MenuItem>
                      <MenuItem value="Train/Flight">Train/Flight</MenuItem>
                      <MenuItem value="International">International</MenuItem>
                    </Select>
                  </FormControl>
                </Grid>
                <Grid item xs={6}>
                  <TextField fullWidth type="date" label={<>Departure Date <Req /></>} InputLabelProps={{ shrink: true }} value={tripForm.date} onChange={(e) => setTripForm({ ...tripForm, date: e.target.value })} size="small" />
                </Grid>
              </Grid>
              <Grid container spacing={2} sx={{ mt: 0.5 }}>
                <Grid item xs={6}>
                  <TextField fullWidth type="number" label="Price Per Person (₹)" value={tripForm.amount} onChange={(e) => setTripForm({ ...tripForm, amount: e.target.value })} size="small" />
                </Grid>
                <Grid item xs={6}>
                  <TextField fullWidth type="number" label={<>Total Seats <Req /></>} value={tripForm.totalSeats} onChange={(e) => setTripForm({ ...tripForm, totalSeats: e.target.value })} size="small" />
                </Grid>
              </Grid>
              <TextField fullWidth multiline rows={2} label="Operational Notes" value={tripForm.notes} onChange={(e) => setTripForm({ ...tripForm, notes: e.target.value })} margin="normal" size="small" />
            </DialogContent>
            <DialogActions sx={{ p: 2 }}>
              <Button onClick={() => setTripDialogOpen(false)}>Cancel</Button>
              <Button variant="contained" onClick={handleSaveTrip}>Save Tour</Button>
            </DialogActions>
          </Dialog>

          {/* ===================== MATERIAL DIALOG: ADD / EDIT PASSENGER (Fix Issue #3: Red Asterisks) ===================== */}
          <Dialog open={paxDialogOpen} onClose={() => setPaxDialogOpen(false)} fullWidth maxWidth="sm">
            <DialogTitle>{editPaxIndex >= 0 ? 'Edit Passenger' : 'Add Passenger to Roster'}</DialogTitle>
            <DialogContent dividers>
              <Grid container spacing={2} sx={{ mt: 0.2 }}>
                <Grid item xs={4}>
                  <TextField fullWidth label={<>Seat # <Req /></>} value={paxForm.seat} onChange={(e) => setPaxForm({ ...paxForm, seat: e.target.value })} size="small" />
                </Grid>
                <Grid item xs={8}>
                  <TextField fullWidth label={<>Full Name <Req /></>} value={paxForm.name} onChange={(e) => setPaxForm({ ...paxForm, name: e.target.value })} size="small" />
                </Grid>
              </Grid>
              <Grid container spacing={2} sx={{ mt: 0.5 }}>
                <Grid item xs={6}>
                  <TextField fullWidth label="Phone" value={paxForm.phone} onChange={(e) => setPaxForm({ ...paxForm, phone: e.target.value })} size="small" />
                </Grid>
                <Grid item xs={6}>
                  <FormControl fullWidth size="small">
                    <InputLabel id="pax-gender-label">Gender</InputLabel>
                    <Select labelId="pax-gender-label" value={paxForm.gender} label="Gender" onChange={(e) => setPaxForm({ ...paxForm, gender: e.target.value })}>
                      <MenuItem value="Male">Male</MenuItem>
                      <MenuItem value="Female">Female</MenuItem>
                      <MenuItem value="Other">Other</MenuItem>
                    </Select>
                  </FormControl>
                </Grid>
              </Grid>

              {activeTrip && activeTrip.type !== 'Local' && (
                <Box sx={{ mt: 2 }}>
                  <Grid container spacing={2}>
                    <Grid item xs={8}>
                      <TextField fullWidth type="date" label="Date of Birth" InputLabelProps={{ shrink: true }} value={paxForm.dob} onChange={(e) => setPaxForm({ ...paxForm, dob: e.target.value })} size="small" />
                    </Grid>
                    <Grid item xs={4}>
                      <TextField fullWidth label="Live Age" value={computeAge(paxForm.dob)} InputProps={{ readOnly: true }} size="small" />
                    </Grid>
                  </Grid>

                  {activeTrip.type === 'Train/Flight' && (
                    <TextField fullWidth label="Aadhaar Number (12 Digits)" value={paxForm.aadhaar} onChange={(e) => setPaxForm({ ...paxForm, aadhaar: e.target.value })} margin="normal" size="small" />
                  )}
                  {activeTrip.type === 'International' && (
                    <TextField fullWidth label="Passport Number" value={paxForm.passport} onChange={(e) => setPaxForm({ ...paxForm, passport: e.target.value })} margin="normal" size="small" />
                  )}
                </Box>
              )}

              <TextField
                fullWidth
                type="number"
                label={activeTrip && activeTrip.type === 'Local' ? "Amount Paid (₹)" : "Advance Paid (₹)"}
                value={paxForm.payment}
                onChange={(e) => setPaxForm({ ...paxForm, payment: e.target.value })}
                margin="normal"
                size="small"
              />
            </DialogContent>
            <DialogActions sx={{ p: 2 }}>
              <Button onClick={() => setPaxDialogOpen(false)}>Cancel</Button>
              <Button variant="contained" onClick={handleSavePassenger}>Save Passenger</Button>
            </DialogActions>
          </Dialog>

          {/* Feedback Snackbar */}
          <Snackbar open={snackbar.open} autoHideDuration={3000} onClose={() => setSnackbar({ ...snackbar, open: false })}>
            <Alert severity={snackbar.severity} sx={{ width: '100%' }}>{snackbar.message}</Alert>
          </Snackbar>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
